name: Build Android APK (Growvest)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (preview generates standalone .apk)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-apk:
    name: Build Android Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Verify EXPO_TOKEN Secret
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error title=Missing EXPO_TOKEN Secret::The 'EXPO_TOKEN' secret is missing or empty in your GitHub repository secrets. Please follow the instructions below to add it."
            exit 1
          fi
          echo "✅ EXPO_TOKEN secret detected."

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: 📦 Install Mobile Dependencies
        working-directory: ./mobile
        run: npm install --legacy-peer-deps

      - name: 🔗 Ensure EAS Project Initialized
        working-directory: ./mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas project:info || eas init --force --non-interactive || true

      - name: 🔨 Execute EAS Android APK Build
        working-directory: ./mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --non-interactive
